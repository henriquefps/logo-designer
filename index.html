<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta name="theme-color" content="#211f1a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LogoGo">

  <!-- PWA Support -->
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" href="./favicon.png">

  <!-- SEO Meta Tags -->
  <title id="seo-title">LogoGo | Premium Custom Logo Designer & Icon Pack Generator</title>
  <meta name="description" id="seo-description"
    content="Create custom styled logos with Lucide icons, premium backgrounds, custom texts, and generate ready-to-use icon packs for Android, iOS, and Web. 100% client-side and free.">
  <meta name="keywords" id="seo-keywords"
    content="logo generator, logo designer, app icon maker, android icon generator, ios icon generator, favicon creator, lucide icons, client-side logo maker, logogo">
  <meta name="author" content="Henrique Silva">
  <link rel="canonical" href="https://hfps.dev">

  <!-- Open Graph / Social Media Metas -->
  <meta property="og:title" id="og-title" content="LogoGo | Premium Custom Logo Designer & Icon Pack Generator">
  <meta property="og:description" id="og-description"
    content="Create custom styled logos and export professional icon packs for Android, iOS, and Web. 100% client-side and free.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://hfps.dev">
  <meta property="og:image" content="https://hfps.dev/logo.png">
  <meta property="og:locale" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://hfps.dev/logo.png">

  <script>
    (function () {
      try {
        var stored = localStorage.getItem('logogo-theme');
        var theme = stored === 'light' || stored === 'dark' ? stored : 'dark';
        document.documentElement.classList.toggle('dark', theme === 'dark');
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
